name: Fetch MOEX data

on:
  schedule:
    # Раз в сутки: 23:00 UTC = 06:00 Новосибирск (UTC+7)
    # До открытия основной сессии МСК
    - cron: '0 23 * * *'

  # Ручной запуск из вкладки Actions
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch metadata (tickers.json)
        run: python scripts/fetch_metadata.py

      - name: Fetch MOEX data (all tickers)
        run: python scripts/fetch_moex.py

      - name: Fetch correlation matrix (all tickers, 2y)
        run: python scripts/fetch_correlation.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Нет изменений — коммит не нужен."
          else
            git commit -m "chore(data): update MOEX quotes $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
