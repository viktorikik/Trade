name: Fetch MOEX data

on:
  schedule:
    # Будни: утренняя (06:50–09:00), основная (09:00–19:00)
    # и вечерняя (19:00–23:50) сессии МСК = 03:50–20:50 UTC
    - cron: '*/15 3-20 * * 1-5'

    # Выходные: дополнительная сессия выходного дня (ДСВД)
    # 09:50–19:00 МСК = 06:50–16:00 UTC
    - cron: '*/15 6-15 * * 6,0'

  # Ручной запуск из вкладки Actions
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    # Нужно, чтобы workflow мог пушить коммиты
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install apimoex pandas requests

      - name: Fetch MOEX data
        run: python scripts/fetch_moex.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Нет изменений — коммит не нужен."
          else
            git commit -m "chore(data): update MOEX quotes $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
