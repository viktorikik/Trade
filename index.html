<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Signals MVP</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Trading Signals MVP</h1>

    <!-- ===== Основные параметры ===== -->
    <div class="controls">
      <label title="Код акции на бирже: SBER — Сбербанк, GAZP — Газпром, LKOH — Лукойл">Тикер:
        <select id="ticker">
          <option value="SBER">SBER</option>
          <option value="GAZP">GAZP</option>
          <option value="LKOH">LKOH</option>
          <option value="GMKN">GMKN</option>
          <option value="ROSN">ROSN</option>
          <option value="NVTK">NVTK</option>
        </select>
      </label>
      <label title="Средняя цена за N дней. Быстрая EMA реагирует на изменения быстро">EMA быстрая:
        <input id="emaFast" type="number" value="9" min="2" max="100" />
      </label>
      <label title="Средняя цена за N дней. Медленная EMA показывает общий тренд">EMA медленная:
        <input id="emaSlow" type="number" value="21" min="2" max="200" />
      </label>
    </div>

    <!-- ===== Параметры бэктеста ===== -->
    <div class="controls">
      <label title="Сколько денег ты вкладываешь в стратегию на старте">Капитал, ₽:
        <input id="capital" type="number" value="100000" min="1000" step="1000" />
      </label>
      <label title="Процент, который брокер берёт с каждой сделки. Обычно 0.03–0.05%">Комиссия, %:
        <input id="commission" type="number" value="0.05" min="0" max="2" step="0.01" />
      </label>
      <label title="Разница между ожидаемой и реальной ценой сделки. Покупаешь чуть дороже, продаёшь чуть дешевле">Проскальзывание, %:
        <input id="slippage" type="number" value="0.05" min="0" max="2" step="0.01" />
      </label>
      <button id="reload">Пересчитать</button>
    </div>

    <!-- ===== Строка статистики ===== -->
    <div id="stats" class="stats"></div>

    <!-- ===== Вердикт системы ===== -->
    <div id="verdict" class="verdict"></div>

    <!-- ===== Детали анализа ===== -->
    <div class="analysis-details">
      <div id="indicatorValues" class="indicator-values"></div>
      <ul id="reasons" class="reasons-list"></ul>
    </div>

    <!-- ===== Метрики бэктеста ===== -->
    <div id="metrics" class="metrics"></div>
  </header>

  <main>
    <div id="chart"></div>
    <div class="equity-title">Equity (стоимость портфеля во времени)</div>
    <div id="equityChart"></div>
  </main>

  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <script src="js/indicators.js"></script>
  <script src="js/backtest.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
