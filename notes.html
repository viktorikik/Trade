<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Заметки — Trading Signals</title>
  <!-- ↑↑ ВНИМАНИЕ: при каждом изменении css/js — поднимай версию в URL ниже ↓↓ -->
  <link rel="stylesheet" href="css/style.css?v=9.7" />

  <!-- PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trading Signals">
  <meta name="theme-color" content="#0a0d12">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    .tab-content-wrap {
      max-width: var(--content-max);
      margin: 0 auto;
      padding: var(--space-lg);
      padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0) + 16px);
    }

    .notes-actions {
      display: flex;
      gap: var(--space-sm);
      flex-wrap: wrap;
      margin-bottom: var(--space-lg);
    }
  </style>
</head>
<body class="has-tabbar">

  <!-- ===== ШАПКА ===== -->
  <header>
    <div class="app-header">
      <div class="app-title">
        <span class="app-title-icon">📝</span>
        <span>Заметки</span>
      </div>
      <div class="app-header-actions">
        <button id="themeToggle" class="header-icon-btn" title="Переключить тему">🌙</button>
      </div>
    </div>
  </header>

  <!-- ===== КОНТЕНТ ===== -->
  <div class="tab-content-wrap">

    <div class="notes-actions">
      <button id="exportNotes" class="secondary">📄 Экспорт заметок CSV</button>
      <button id="clearNotes" class="danger">🗑 Очистить все</button>
    </div>

    <div id="notesGrid" class="notes-grid"></div>

    <div id="emptyState" class="empty-state" style="display:none;">
      Пока пусто.<br>
      Открой <a href="index.html">главную страницу</a>, выбери акцию и нажми <b>«📝 В заметки»</b>.
    </div>

  </div>

  <!-- ===== ТАБ-БАР ===== -->
  <nav class="tab-bar">
    <a class="tab-button" href="index.html?tab=overview">
      <span class="tab-icon">📊</span>
      <span class="tab-label">Обзор</span>
    </a>
    <a class="tab-button" href="index.html?tab=analysis">
      <span class="tab-icon">🔍</span>
      <span class="tab-label">Анализ</span>
    </a>
    <a class="tab-button" href="index.html?tab=strategy">
      <span class="tab-icon">🎯</span>
      <span class="tab-label">Стратегия</span>
    </a>
    <a class="tab-button active" href="notes.html">
      <span class="tab-icon">📝</span>
      <span class="tab-label">Заметки</span>
    </a>
  </nav>

  <div id="toast" class="toast"></div>

  <script>
    // ---------- Тема ----------
    (function () {
      const THEME_KEY = 'trading-signals-theme';
      const themeToggle = document.getElementById('themeToggle');
      const rootEl = document.documentElement;

      function applyTheme(theme) {
        rootEl.setAttribute('data-theme', theme);
        themeToggle.textContent = theme === 'light' ? '☀️' : '🌙';
        // Обновим theme-color в meta для iOS
        const metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          metaTheme.setAttribute('content', theme === 'light' ? '#f5f7fa' : '#0a0d12');
        }
      }

      const saved = localStorage.getItem(THEME_KEY);
      if (saved === 'light' || saved === 'dark') {
        applyTheme(saved);
      } else {
        const isLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        themeToggle.textContent = isLight ? '☀️' : '🌙';
      }

      themeToggle.addEventListener('click', () => {
        const current = rootEl.getAttribute('data-theme') || 'dark';
        const next = current === 'light' ? 'dark' : 'light';
        localStorage.setItem(THEME_KEY, next);
        applyTheme(next);
      });

      // Регистрация service worker (только в браузере, не в file://)
      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((err) => {
            console.warn('SW registration failed:', err);
          });
        });
      }
    })();
  </script>

  <!-- ===== СКРИПТЫ =====
       Все src — с ?v=9.2. При изменениях в JS — поднимай версию. -->
  <script src="js/storage.js?v=9.2"></script>
  <script src="js/indicators.js?v=9.2"></script>
  <script src="js/notes.js?v=9.2"></script>
</body>
</html>
